# easycms.dev on the server, in /srv/easycms (README.md, Deploying):
#   compose.yaml, Caddyfile   this folder, copied by the deploy workflow
#   .env                      the production variables; written by hand, never committed
#   data/, uploads/           the SQLite database and uploaded files
#
#   docker compose up -d

# Logs are rotated: at most 3 files of 10 MB per service, a few weeks at today's volume. The
# privacy policy says so (failed sign-ins are logged with the IP address).
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  web:
    image: ${WEB_IMAGE:-ghcr.io/maritonx/easy-cms-website:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/cms.db
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    mem_limit: 1536m
    cpus: 1.5
    logging: *logging
    networks: [web]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 128m
    logging: *logging
    networks: [web]
    depends_on: [web]

networks:
  web: {}

volumes:
  caddy-data: {}
  caddy-config: {}
