name: Jobs

# Runs Easy CMS's scheduled jobs every 10 minutes: scheduled publishing, social posts and their
# retries, webhook retries. Vercel Hobby crons run once a day (vercel.json keeps that one as a
# fallback). Needs the repository secret CRON_SECRET, the same value as on Vercel, and the
# variable SITE_URL (e.g. https://easycms.dev).
#
# GitHub runs scheduled workflows late when it is busy, and turns them off after 60 days without
# activity in the repository: Actions → Jobs → Enable workflow turns it back on.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run jobs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "::error::Set the secret CRON_SECRET and the variable SITE_URL"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            --retry 2 --retry-all-errors \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cms/jobs/run"
          echo
