name: Deploy

# Builds the image on an arm64 runner (the server is a Hetzner CAX, arm64), pushes it to
# ghcr.io/maritonx/easy-cms-website and restarts the site on the server (README.md, Deploying).
#
# Repository secrets:
#   DEPLOY_HOST          the server's IP address
#   DEPLOY_SSH_KEY       a private key whose public half is in /home/deploy/.ssh/authorized_keys
#   DEPLOY_KNOWN_HOSTS   `ssh-keyscan <host>` output, so the runner knows it is the right server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: DOCS_REF=${{ vars.DOCS_REF }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  server:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: deploy
      - name: SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Copy compose.yaml and Caddyfile
        run: |
          scp deploy/compose.yaml deploy/Caddyfile deploy@${{ secrets.DEPLOY_HOST }}:/srv/easycms/
          # Studio's files and site blocks come from the Easy CMS repo; until its first release,
          # an empty studio.caddy (Caddy imports it) and an empty folder.
          ssh deploy@${{ secrets.DEPLOY_HOST }} "cd /srv/easycms && touch studio.caddy && mkdir -p studio"
      - name: Pull and restart
        run: |
          # The job's token reads the image, whether the package is public or private, and expires
          # with the job; the server logs out after the pull.
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh deploy@${{ secrets.DEPLOY_HOST }} \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin >/dev/null"
          ssh deploy@${{ secrets.DEPLOY_HOST }} "cd /srv/easycms \
            && WEB_IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }} docker compose pull web; s=\$?; docker logout ghcr.io >/dev/null; [ \$s -eq 0 ] \
            && WEB_IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }} docker compose up -d --remove-orphans \
            && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile"
      - name: Check the site
        run: |
          for i in $(seq 1 20); do
            if ssh deploy@${{ secrets.DEPLOY_HOST }} "docker inspect -f '{{.State.Health.Status}}' easycms-web-1" | grep -q healthy; then exit 0; fi
            sleep 6
          done
          echo "web did not become healthy"; exit 1
      # Each deploy pulls a new image and keeps the old ones: on 2026-11-28 they filled the disk
      # (38 GB, 100%), SQLite couldn't write (SQLITE_IOERR) and the site went down. Once the new
      # one is healthy, images no container uses go: a rollback pulls its tag again from ghcr.io.
      - name: Remove unused images
        run: |
          ssh deploy@${{ secrets.DEPLOY_HOST }} "docker image prune -af >/dev/null && df -h / | tail -1" | tee disk.txt
          used=$(awk '{gsub("%", "", $5); print $5}' disk.txt)
          if [ "$used" -ge 80 ]; then echo "::warning title=Server disk::${used}% of the server's disk is used"; fi
